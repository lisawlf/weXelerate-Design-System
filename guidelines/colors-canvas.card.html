<!-- @dsCard group="Colors" viewport="700x150" name="Canvas & ink" subtitle="White canvas, #0e0e0e ink and dark canvas, offwhite dividers" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--wx-canvas);font-family:var(--wx-font-body)}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--wx-radius-md)}.n{font-family:var(--wx-font-display);font-size:12px;font-weight:600;color:var(--wx-ink)}.h{font-family:var(--wx-font-mono);font-size:11px;letter-spacing:.06em;color:var(--wx-muted)}</style></head><body><div class="sw">
<div class="s"><div class="chip" style="background:var(--wx-whitespace);box-shadow:inset 0 0 0 1px var(--wx-hairline)"></div><span class="n">whitespace</span><span class="h">#ffffff</span></div>
<div class="s"><div class="chip" style="background:var(--wx-offwhite)"></div><span class="n">offwhite</span><span class="h">#d9d9d9</span></div>
<div class="s"><div class="chip" style="background:var(--wx-dark-whitespace)"></div><span class="n">dark whitespace / ink</span><span class="h">#0e0e0e</span></div>
</div></body></html>
