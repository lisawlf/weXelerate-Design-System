<!-- @dsCard group="Colors" viewport="700x170" name="Lime spark & selection" subtitle="One lime moment per view; lime is also the selection plate" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--wx-canvas);font-family:var(--wx-font-body)}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--wx-radius-md)}.n{font-family:var(--wx-font-display);font-size:12px;font-weight:600;color:var(--wx-ink)}.h{font-family:var(--wx-font-mono);font-size:11px;letter-spacing:.06em;color:var(--wx-muted)}.pill{display:inline-block;padding:11px 26px;border-radius:var(--wx-radius-pill);font-family:var(--wx-font-display);font-size:13px;font-weight:600}</style></head><body><div class="sw" style="align-items:flex-start">
<div class="s"><div class="chip" style="background:var(--wx-whisper)"></div><span class="n">whisper · lime</span><span class="h">#dcff00 · black text only</span></div>
<div class="s" style="gap:10px"><span class="pill" style="background:var(--wx-whisper);color:var(--wx-ink)">Join the tour</span>
<span style="font-family:var(--wx-font-body);font-size:14px;color:var(--wx-body)">Drag over this line: <mark style="background:var(--wx-select);color:var(--wx-select-ink)">selection is lime with black ink</mark>, never browser blue.</span>
<span style="display:block;width:28px;height:2px;background:var(--wx-whisper)"></span><span class="h">28×2px signal bar on program cards</span></div>
</div></body></html>
