<!-- @dsCard group="Colors" viewport="700x170" name="Text ramp" subtitle="Ink → body → muted → faint, and the on-dark pair" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--wx-canvas);font-family:var(--wx-font-body)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-family:var(--wx-font-display);font-size:17px;font-weight:700;color:var(--wx-ink-soft)">Ink #111 — headlines</span>
<span style="font-size:15px;color:var(--wx-body)">Body #222 — running copy</span>
<span style="font-size:14px;color:var(--wx-muted)">Muted #777 — captions, placeholders</span>
<span style="font-size:13px;color:var(--wx-faint)">Faint #aaa — metadata only (fails AA)</span>
<span style="font-size:14px"><a href="#">Inline link — navy #102030</a></span>
</div>
<div style="background:var(--wx-dark-whitespace);border-radius:var(--wx-radius-md);padding:14px;display:flex;flex-direction:column;gap:8px">
<span style="font-family:var(--wx-font-display);font-size:17px;font-weight:700;color:var(--wx-on-dark)">On dark #ffffff</span>
<span style="font-size:14px;color:var(--wx-on-dark-muted)">On dark muted #aaaaaa</span>
<span style="font-size:14px;color:rgba(255,255,255,.78)">Over photography rgba(255,255,255,.78)</span>
</div></div></body></html>
