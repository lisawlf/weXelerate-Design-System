<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--wx-canvas);font-family:var(--wx-font-body)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--wx-body)">
