<!-- @dsCard group="Brand" viewport="700x170" name="Interaction — inversion" subtitle="Ghost pill at rest, solid on hover; there is no filled rest state" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--wx-canvas);font-family:var(--wx-font-body)}</style></head><body><div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px"><span style="display:inline-block;padding:11px 26px;border-radius:999px;border:1px solid var(--wx-ink);font-family:var(--wx-font-display);font-size:13px;font-weight:600;color:var(--wx-ink)">Rest</span><span style="display:inline-block;padding:11px 26px;border-radius:999px;background:var(--wx-ink);color:#fff;font-family:var(--wx-font-display);font-size:13px;font-weight:600">Hover — inverted</span><span style="display:inline-block;padding:11px 26px;border-radius:999px;border:1px solid var(--wx-ink);opacity:.4;font-family:var(--wx-font-display);font-size:13px;font-weight:600;color:var(--wx-ink)">Disabled</span><span style="font-family:var(--wx-font-mono);font-size:11px;letter-spacing:.1em;color:var(--wx-muted)">0.18S EASE</span></div>
<div style="display:flex;align-items:center;gap:12px;background:var(--wx-dark-whitespace);padding:14px;border-radius:var(--wx-radius-md)"><span style="display:inline-block;padding:10px 20px;border-radius:999px;border:1px solid #444;font-family:var(--wx-font-display);font-size:13px;font-weight:600;color:var(--wx-on-dark-muted)">Rest on dark</span><span style="display:inline-block;padding:10px 20px;border-radius:999px;background:#fff;color:var(--wx-ink);font-family:var(--wx-font-display);font-size:13px;font-weight:600">Hover on dark</span></div>
</div></body></html>
